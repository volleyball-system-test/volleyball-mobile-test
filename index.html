<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>全国バレーボール協議会 スマホ確認版 0.3.46</title>
<style>:root{font-family:system-ui,"Yu Gothic",sans-serif;color:#162844;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}header{background:#122344;color:white;padding:20px}header h1{font-size:18px;margin:0 0 7px}header small{color:#b5c8e7}nav{display:flex;gap:7px;overflow-x:auto;padding:12px;background:#122344}nav button{white-space:nowrap;border:0;border-radius:9px;padding:12px;color:white;background:#284a7c;font-size:14px}nav button.active{background:#4777be}main{padding:16px;max-width:1100px;margin:auto}.notice{background:#fff4df;border:1px solid #e4bb72;padding:13px;border-radius:12px;line-height:1.6}.panel{background:white;padding:18px;border:1px solid #dce4f0;border-radius:13px;margin:14px 0}select,button{font:inherit}select{width:100%;padding:11px;margin:7px 0 14px;border:1px solid #b7c5d9;border-radius:8px}label{font-weight:600;font-size:13px}table{border-collapse:collapse;width:100%}th,td{padding:12px 8px;text-align:left;border-bottom:1px solid #e5ebf3;font-size:13px}th{background:#f4f7fc}.scroll{overflow:auto}h2{font-size:22px}.muted{color:#61728b;font-size:13px}.tag{background:#e7effb;border-radius:20px;padding:3px 9px}button{cursor:pointer}@media(min-width:850px){main{padding:30px}}</style></head><body>
<header><h1>新日本スポーツ連盟<br>全国バレーボール協議会 登録システム</h1><small>Ver.0.3.46 スマホ動作確認用・架空データのみ</small></header>
<nav id="nav"></nav><main><div class="notice"><strong>公開テスト専用</strong>：このファイルには実在する選手・チームのデータ、ログイン情報、バックアップ読込機能、データ送信機能は含まれません。入力内容も保存されません。</div><div class="panel"><label for="role">管理者区分（表示確認）</label><select id="role"><option value="全国事務局">全国事務局</option><option value="都道府県協議会">都道府県協議会</option><option value="地域・ブロック協議会">地域・ブロック協議会</option></select><label for="council">担当協議会（表示確認）</label><select id="council"><option>東京都バレーボール協議会</option><option>千葉県バレーボール協議会</option><option>東日本バレーボール協議会</option></select><p class="muted">実システムの権限制御ではありません。メニュー切替と画面幅の確認用です。</p></div><section id="content"></section></main>
<script>
const pages=['ダッシュボード','協議会マスター','チームマスター','選手登録','レンタル選手','Excel取込','ログインIDマスター'];let page=pages[0];
const teams=[{id:'DEMO-001',name:'サンプルA',c:'東京都バレーボール協議会'},{id:'DEMO-002',name:'サンプルB',c:'千葉県バレーボール協議会'}];const players=[{id:'DEMO-001-0001',name:'テスト 太郎',team:'サンプルA'},{id:'DEMO-002-0001',name:'テスト 花子',team:'サンプルB'}];
function render(){document.getElementById('nav').innerHTML=pages.map(p=>`<button type="button" class="${p===page?'active':''}" data-page="${p}">${p}</button>`).join('');const c=document.getElementById('council').value;let body='';
if(page==='ダッシュボード')body='<p>スマホでの画面切替を確認するための独立したデモです。</p><p>サンプル協議会：3件 ／ サンプルチーム：2件 ／ サンプル選手：2件</p>';
else if(page==='チームマスター')body='<div class="scroll"><table><tr><th>チームID</th><th>チーム名</th><th>所属協議会</th></tr>'+teams.filter(t=>t.c===c||document.getElementById('role').value==='全国事務局').map(t=>`<tr><td>${t.id}</td><td>${t.name}</td><td>${t.c}</td></tr>`).join('')+'</table></div>';
else if(page==='選手登録')body='<div class="scroll"><table><tr><th>選手ID</th><th>氏名</th><th>所属チーム</th></tr>'+players.filter(p=>teams.some(t=>t.name===p.team&&(t.c===c||document.getElementById('role').value==='全国事務局'))).map(p=>`<tr><td>${p.id}</td><td>${p.name}</td><td>${p.team}</td></tr>`).join('')+'</table></div>';
else if(page==='ログインIDマスター')body='<p>画面枠のみ。ID発行・認証・権限設定は未実装です。</p>';
else body='<p>この画面はスマホでメニューを開けるか確認するための仮画面です。実際の登録・取込・保存機能はありません。</p>';
document.getElementById('content').innerHTML=`<div class="panel"><h2>${page}</h2>${body}</div>`;}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('button[data-page]');if(b){page=b.dataset.page;render();}});document.getElementById('role').addEventListener('change',render);document.getElementById('council').addEventListener('change',render);render();
</script></body></html>
